name: hat_client
description: "HAT Hydroponics — Smart IoT Monitoring & Control"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Supabase (Auth + Realtime + DB) ──
  supabase_flutter: ^2.8.0

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── Navigation ──
  go_router: ^14.8.1

  # ── Charts ──
  fl_chart: ^0.70.2

  # ── HTTP ──
  http: ^1.2.2

  # ── UI / UX ──
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
