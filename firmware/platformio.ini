; ═══════════════════════════════════════════════════════════════════════
;  HAT — ESP32-S3 Hydroponics Sensor Node
; ═══════════════════════════════════════════════════════════════════════
;
;  Board  : ESP32-S3 DevKitC-1
;  Active : TDS/EC (GPIO 3), Moisture (GPIO 1), DHT22 (GPIO 4),
;           Ultrasonic (GPIO 5/18), Flow (GPIO 19), Relay (GPIO 2)

[env:esp32s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; ── Serial Monitor Setup ─────────────────────────────────────────
; Prevent VS Code monitor from holding ESP32-S3 in reset lock
monitor_speed = 115200
monitor_rts   = 0
monitor_dtr   = 0

; ── USB CDC / UART Serial Configuration ──────────────────────────
; CDC_ON_BOOT=0 routes Serial to standard UART0 (COM port).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ── Libraries ───────────────────────────────────────────────────
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0